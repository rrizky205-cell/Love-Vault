<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#37474F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="400" height="500" rx="20" fill="#F9F8F5"/>
  <!-- Subtle Sage Accent Block -->
  <rect x="235" y="40" width="130" height="230" rx="8" fill="#E8ECE9" opacity="0.7"/>

  <!-- Editorial Header -->
  <text x="32" y="42" font-family="'Quicksand', sans-serif" font-size="10" font-weight="800" fill="#78909C" letter-spacing="2">
    ARCHIVE // VOL. 01
  </text>
  <text x="32" y="58" font-family="'Quicksand', sans-serif" font-size="14" font-weight="bold" fill="#2E3D34" letter-spacing="1">
    TWO OF US
  </text>

  <!-- Photo 1 (Hero Portrait Left) -->
  <g filter="url(#cleanShadow)">
    <rect x="32" y="75" width="186" height="345" rx="10" fill="#FFFFFF"/>
    <rect x="38" y="81" width="174" height="333" rx="6" fill="#F0EDE6" stroke="#E6E2D8" stroke-width="1"/>
  </g>

  <!-- Photo 2 (Square/Landscape Right) -->
  <g filter="url(#cleanShadow)">
    <rect x="236" y="125" width="132" height="175" rx="8" fill="#FFFFFF"/>
    <rect x="242" y="131" width="120" height="163" rx="5" fill="#F0EDE6" stroke="#E6E2D8" stroke-width="1"/>
  </g>

  <!-- Minimalist Right Side Typography -->
  <g transform="translate(236, 335)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#8D6E63" stroke-width="1.5"/>
    <text x="0" y="22" font-family="'Caveat', cursive" font-size="16" fill="#5D4037">
      forever and always.
    </text>
    <text x="0" y="42" font-family="'Quicksand', sans-serif" font-size="9" font-weight="600" fill="#8D6E63" letter-spacing="0.5">
      WITH YOU IS MY FAVORITE
    </text>
    <text x="0" y="55" font-family="'Quicksand', sans-serif" font-size="9" font-weight="600" fill="#8D6E63" letter-spacing="0.5">
      PLACE TO BE.
    </text>
  </g>

  <!-- Minimalist Footer Line -->
  <line x1="32" y1="455" x2="368" y2="455" stroke="#E0DDD5" stroke-width="1"/>
  <text x="32" y="475" font-family="'Quicksand', sans-serif" font-size="9" font-weight="600" fill="#9E9E9E" letter-spacing="1">
    LOVEVAULT • CURATED MEMORIES
  </text>
  <text x="368" y="475" text-anchor="end" font-family="'Quicksand', sans-serif" font-size="9" font-weight="bold" fill="#C9184A">
    01/01 ❤️
  </text>
</svg>
